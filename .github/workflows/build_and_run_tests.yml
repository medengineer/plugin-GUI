name: Build and Run Tests

on:
  push:
    branches:
      - 'tmp'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    - name: build
      env:
        CC: gcc-10
        CXX: g++-10
      run: |
        sudo apt update
        cd Resources/Scripts
        sudo ./install_linux_dependencies.sh
        sudo apt install -y pulseaudio
        pulseaudio --start
        pactl load-module module-null-sink sink_name=VirtualOutput
        pactl list short sinks
        cd ../../Build && cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..
        make -j8
    - name: run tests
      run: |
        cd Resources/Scripts
        chmod +x run_unit_tests_linux.sh
        ./run_unit_tests_linux.sh
      shell: bash
